<text x="56" y="520" font-size="30" font-weight="700" fill="#1d1b17">→ 모양만 고친다, 뜻은 모델이 판단</text><text x="56" y="584" font-size="30" fill="#c0392b">✗ <tspan fill="#6b665c" text-decoration="line-through">Req는 LLM 전용 함수</tspan></text>
<text x="56" y="628" font-size="30" font-weight="700" fill="#1d1b17">→ 어디서나 쓰는 클래스(양식)</text><text x="56" y="716" font-size="26" fill="#6b665c">질문 11개 · 문제 정답 18 / 42 (자기 채점) · 눌러서 전체 보기</text>
